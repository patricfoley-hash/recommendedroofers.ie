<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="360" height="80"
  role="img" aria-label="Recommended Roofing &amp; Guttering">

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&amp;display=swap');
    </style>
  </defs>

  <!-- "Recommended" — Poppins 800, primary blue -->
  <text
    x="4" y="38"
    font-family="'Poppins', 'Segoe UI', Arial, sans-serif"
    font-weight="800"
    font-size="29"
    fill="#1E40AF"
    letter-spacing="-0.3">Recommended</text>

  <!-- "ROOFING & GUTTERING" — stretched to match "Recommended" width -->
  <text
    x="4" y="62"
    text-anchor="start"
    font-family="'Poppins', 'Segoe UI', Arial, sans-serif"
    font-weight="600"
    font-size="13.5"
    fill="#F59E0B"
    textLength="227"
    lengthAdjust="spacing">ROOFING &amp; GUTTERING</text>


</svg>
